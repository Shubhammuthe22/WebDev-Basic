<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM challenges</title>
    <style>
        body{
            background-color: #1a1a1a;
            text-align: center;
            color: aliceblue;
        }
        p{
            color: aliceblue;
        }
        h1{
            color: aliceblue;
        }
        h2{
            color: aliceblue;
        }
        .highlight{
            background-color: aqua;
            color: #1a1a1a;
        }
    </style>
   
</head>
<body>
    <h1>Javascript DOM Challenges</h1>
    <!-- This the example 1. -->
    <section id="example-1">
        <h2>Accessing DOM elements</h2>
        <p id="myParagraph">
            This is the context.Click on the button below to change me.
        </p>
        <button id="changeText">Change Text</button>
    </section>

    <!-- This is example-2 -->
     <section id="example-2">
        <h2>Traversing through DOM</h2>
        <ul id="citiesList">
            <li class ="Demo">New York</li>
            <li>London</li>
            <li>Tokyo</li>
            <li>Paris</li>
        </ul>
        <button id="highlightButton">Change First City</button>
     </section>

     <!-- Example-3 -->
     <section id="example-3">
        <h2>Manipulating DOM elements.</h2>
        <div id="coffeeOrder">Order:
            <span id="coffeetype">Latte</span>
        </div>
        <button id="changeOrder">Change to Espresso</button>
     </section>
 <script src="./script.js"></script>
</body>
</html>
