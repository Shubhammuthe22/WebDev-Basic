<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        body{
            /* background-color: #282727; */
            background: #0a0a0a;
            background: linear-gradient(150deg, rgba(10, 10, 10, 1) 0%, rgba(150, 150, 150, 1) 100%);
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            color: aliceblue;
        }
        .container{
        
            /* width: 400px;
            height: 100%; */
            border: 1px solid beige;
            display: flex;
            justify-content: center;
            border-radius: 15px;
            padding: 15px;
            margin: 0;

        }
        .button{
            display: flex;
            flex-direction: row;
            /* font-weight: bold; */
            /* margin-right: 100px; */
            
        }
        .content{

            margin-bottom: 0px;
            align-items: center;
        }
        .image{
            border-radius: 15px;
            margin-bottom: 0;
        }
        button{
            margin-right: 60px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
        }
        button:hover{
            background-color: #262626;
            color: aliceblue;
            transition: 0.4ms;
            cursor: pointer;
        }
        h2{
            color: aliceblue;
            margin-bottom: 0;
        }
        p{
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>Flipkart</h1>
    <div class="container">
        <div class="content"><img class="image" src="jersey.webp" alt="" height="300px" width="300px">
        <p><h2>Manchester City Jersey</h2></p>
        <p>Rating:4.2/5</p>
            <div class="button"><button type="submit">Add To cart</button>
                 <button type="submit">Buy Now</button>
            <div>
        <div>
    </div>
</body>
</html>
