<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navabar Variations Css</title>
    <style>
        body{
            background-color: #1a1a1a;
            font-family: Arial, Helvetica, sans-serif;
        }
        h2{
            color: aliceblue;
            
        }
        .nav1 ul{
            list-style-type: none;
            display: flex;
            justify-content: space-around;
            padding: 0;
            margin: 0;
        }
        .nav1{
            background-color: #f1efef;
            padding: 10px;
            margin: 0;
        }
        .nav1 a{
            color:#090909;
            text-decoration: none;
            padding: 5px 15px;
            border-radius: 6px;
            position: relative;
        }
        .nav1 .login-button{
            background-color: #367aef;
            color: aliceblue;
            border: none;
            border-radius: 5px;
            padding: 5px 8px;
            margin-bottom: none;
            cursor: pointer;
        }
        .nav1 a::after{
            position: absolute;
            content: "";
            background-color: #4381fd;
            height: 2px;
            width: 100%;
            left: 0;
            bottom: 0;
            transform: scaleX(0);
            transition: transform 0.2s ease-in-out;
        }
        .nav1 a:hover::after{
            transform: scaleX(1);
        }
        
    </style>
</head>
<body>
    <div class="nav-container">
    <h2>Horizontal navbar with underline effect</h2>
    <nav class="nav1">
        <ul>
            <li> <a href="#">Home</a></li>
            <li> <a href="#">About</a></li>
            <li> <a href="#">Products</a></li>
            <li><button class="login-button">Login</button></li>
        </ul>
        
    </nav>
    </div>
</body>
</html>
