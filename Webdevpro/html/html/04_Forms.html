<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h3>Personal Details</h3>
    <form>
        <label for="">
            Name: <input type="text" placeholder="Enter your Name" id="">
        </label><br><br>
        <label for="">
            Mobile No: <input type="text" placeholder="Enter your Number" id="">
        </label><br><br>
        <label for="">
            Email: <input type="email" placeholder="Enter email " id="">
        </label><br><br>
        <label for="">
            DOB: <input type="date" name="" id="">
        </label><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form><br>

    <h3>More Details</h3>
    <form>
        
        <label>
            Games: 
            <select name="Games" id="">
                <option value="Cricket">Cricket</option>
                <option value="Football">Football</option>
                <option value="Volleyball">Volleyball</option>
            </select>
        </label><br>
        <label for="">
            Your qualification: 
            <label for="Your qualification">
                SSC: <input type="checkbox" name="" id="">
            </label>
            <label for="Your qualification">
                HSC: <input type="checkbox" name="" id="">
            </label>
            <label for="Your qualification">
                Graduation: <input type="checkbox" name="" id="">
            </label>
        </label><br>
        <label for="">
            Gender:
            <input type="radio" name="gender" id="male" value="Male">
            <label for="Male">Male</label><br>
            <input type="radio" name="gender" id="female" value="Female">
            <label for="female">Female</label><br>
            <input type="radio" name="gender" id="other" value="Other">
            <label for="other">Other</label><br>
            
        </label>
    </form>
</body>
</html>
