<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOm Finale</title>
    <style>
        body{
            background-color: #1a1a1a;
            text-align: center;
            color: aliceblue;
        }
        p{
            color: aliceblue;
        }
        h1{
            color: aliceblue;
        }
        h2{
            color: aliceblue;
        }
        .highlight{
            background-color: aqua;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <!-- Example- 6 -->
    <section id="EventHandling">
        <h2>Event handling in DOM</h2>
        <button id="clickMe">Click Me!</button>
    </section>

    <!-- example- 7 -->
     <section id="example-7">
        <h2>Event Delegation</h2>
        <ul id="carsList">
            <li class="listItems">Audi</li>
            <li class="listItems">Mercedes</li>
            <li class="listItems">Ferrari</li>
        </ul>
        <p>click on the car to select it!</p>
     </section>

     <!-- Example -8 -->
     <section id="example-8">
        <h2>Form Handling</h2>
        <form id="feedbackForm">
            <label for="feedbackInput">Your Feedback:</label>
            <input type="text" id="feedbackInput" placeholder="Enter Your Feedback">
            <button id="submit">Submit Feedback</button>
        </form>
        <p id="formHandling"></p>
     </section>

     <!-- example 9 -->
      <section id="example-9">
        <h2>DOM content Loaded</h2>
        <p id="DOMstatus">Waiting for DOM to load..</p>
      </section>
     <script src="./script.js"></script>

     <!-- example 10 -->
      <section id="example-10">
        <h2>Toggle CSS Manipulation</h2>
        <p id="descriptionText">This is the text that will change!</p>
        <button id="toggleButton">Toggle Text</button>
      </section>
</body>
</html>
