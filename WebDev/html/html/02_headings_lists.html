<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Lorem ipsum dolor sit.</h1>
    <p>Lorem ipsum dolor sit, amet <strong>consectetur</strong> adipisicing elit.</p>
    <ul>
        <li>Mango</li>
        <li>Apple</li>
        <li>Banana</li>
    </ul>
    <!-- Ul tag is used for unordered list-->
    <ol>
        <li>Black tea</li>
        <li>Milk tea</li>
        <li>Green tea</li>
    </ol>
    <!-- ol tag is used for ordered list -->

    <div> <!-- div is just a container-->
        <h2>Block level elements</h2>
        <ul>
            <li>Headings h1 to h6</li>
            <li>Lists</li>
            <li>para</li>
        </ul>
    </div>

     <div>
        <h2>Inline Elements</h2>
        <ul>
            <li>img</li>
            <li>a (links)</li>
            <li>strong</li>
            <li>em</li>
        </ul>
    </div>

</body>
</html>
