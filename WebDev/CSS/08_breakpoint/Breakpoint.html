<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive webpage</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .responsive{
            font-family: Arial, Helvetica, sans-serif;
            color: aliceblue;
            padding: 15px;
            font-size: 22px;
            background-color: #61a7fd;
            width: 100%;
            max-width: 1000px;  
        }
        @media( max-width: 600px){  
            .responsive{
                background-color:#f739be;
        }
    }
    /* @media signifies the breakpoint property */
        @media(min-width:601px) and (max-width:800px){
            body{
                align-items: flex-start;
            }
            .responsive{
                background-color: #f54343;
               
            }
        }
        
    </style>
</head>
<body>
    <div class="responsive">
        This div changes the colour according to the different sizes.
    </div>
</body>
</html>
