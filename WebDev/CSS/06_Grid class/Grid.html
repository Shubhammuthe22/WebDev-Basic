<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Masterclass</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .container{
            border: 2px solid black;
            margin: 0;
            padding: 15px;
            margin-bottom: 20px;
        }
        .grid-container{
            background-color: #f1f0f0;
            display: grid;
            margin-bottom: 10px;
            padding: 10px;
            gap: 10px;
        }
        .box{
            background-color: #ff4040;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 18px;
        }
        .box:nth-child(even){
            background-color: #358ff6;
        }
    </style>
</head>
<body>
    <h1>CSS Grid Demo</h1>
    <div class="container">
        <h2>1.Basic Grid 3*3</h2>
        <div class="grid-container"
        style="grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3, 100px);">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
        </div>
    </div>
    <div class="container">
        <h2>2.Grid with different column sizes</h2>
        <div class="grid-container"
        style="grid-template-columns: 1fr 2fr 1fr;
        grid-template-rows: 200px;
        grid-template-rows: repeat(3,100px);"
        >
            <div class="box" 
            style="grid-column: 1/3;
            grid-row: 1/3;"
            >1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
           
        </div>
    </div>
    <div class="container">
        <h2>3.Grid template areas</h2>
        <div class="grid-container"
        style="grid-template-areas: 'header header header header' 'sidebar main-content main-content main-content' 
        'footer footer footer footer';
        grid-template-rows: 50px 300px 50px;">
            <div class="box" style="grid-area: header;">Header</div>
            <div class="box" style="grid-area: sidebar;">Sidebar</div>
            <div class="box" style="grid-area: main-content;">Main Content</div>
            <div class="box" style="grid-area: footer;">Footer</div>  
             <!-- Here grid-area is parent and the header,sidebar etc are the child of it -->
              <!--grid-template-areas is plural and used for the parent  -->
        </div>
    </div>

    <div class="container">
        <h2>4.Auto-Fit and minmax</h2>
        <div class="grid-container"
        style="grid-template-columns: repeat(Auto-Fit, minmax(100px,1fr));">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>    
            <div class="box">5</div>    
            <div class="box">6</div>    
        </div>
    </div>

    <div class="container">
        <h2>5.Alignment and justification</h2>
        <div class="grid-container"
        style="grid-template-columns: repeat(4,1fr);
        height: 200px;
        align-items: center;">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>  
        </div>
    </div>
</body>
</html>
